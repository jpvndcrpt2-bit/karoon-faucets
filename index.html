<title>شیرآلات کارون</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600;800&display=swap">
<style>
/* Layout: full-bleed dark hero with floating round controls, white editorial sections, red dot as the one accent, slide-in full menu */
:root{
  --bg:#f5f5f4; --surface:#ffffff; --ink:#18181b; --muted:#5d5d63; --line:#e1e1e0;
  --red:#c4122f; --red-ink:#ffffff; --dark:#0e0e10; --dark2:#1b1b1f; --dark-ink:#f1f1f2; --water:#6cc9e6;
  --f-disp:'Lalezar','Vazirmatn',system-ui,sans-serif; --f-body:'Vazirmatn',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101012;--surface:#18181b;--ink:#f1f1f2;--muted:#a2a2a9;--line:#2c2c31;--red:#e0344f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101012;--surface:#18181b;--ink:#f1f1f2;--muted:#a2a2a9;--line:#2c2c31;--red:#e0344f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;margin:0;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:800;line-height:1.35;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.full{margin-inline:calc(50% - 50vw);width:100vw}
/* top bar over hero */
.top{position:absolute;top:0;inset-inline:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:12px;color:#fff;text-decoration:none}
.brand b{font-family:var(--f-disp);font-weight:400;font-size:38px;line-height:1}
.brand span{font-size:13px;opacity:.75;border-inline-start:1px solid #ffffff55;padding-inline-start:12px}
.tools{display:flex;gap:8px}
.rb{width:44px;height:44px;border-radius:50%;background:#fff;color:#111;border:0;display:grid;place-items:center;cursor:pointer;font:inherit;font-weight:800;font-size:13px}
.rb svg{width:20px;height:20px}
.rb:hover{background:var(--red);color:#fff}
/* hero */
.hero{position:relative;background:radial-gradient(70% 90% at 30% 55%,#2a2a30 0,var(--dark) 70%);color:var(--dark-ink);min-height:620px;overflow:hidden;display:grid;align-items:center;padding-block:110px 70px}
.hero .in{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;width:100%;max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.hero h1{font-size:clamp(34px,5.4vw,68px);font-weight:800}
.hero p{max-width:44ch;opacity:.78;margin:14px 0 0}
.hero .fx{display:grid;place-items:center;position:relative}
.hero .fx svg.f{width:min(520px,100%);height:auto;filter:drop-shadow(0 30px 40px #000a)}
.hi{width:min(500px,100%);aspect-ratio:1;object-fit:cover;border-radius:14px;box-shadow:0 30px 60px #000a}
.pill{display:none;position:absolute;bottom:0;inset-inline-start:0;display:flex;gap:8px}
.pill button{width:26px;height:26px;border-radius:50%;border:2px solid #fff3;cursor:pointer;padding:0}
.pill button[aria-pressed="true"]{border-color:#fff}
.go{position:absolute;bottom:26px;inset-inline-start:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-size:15px}
.go i{width:46px;height:46px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-style:normal;font-size:22px;transition:transform .2s}
.go:hover i{transform:translateX(-4px)}
.rail{position:absolute;inset-inline-end:max(10px,env(safe-area-inset-left,0px));top:50%;writing-mode:vertical-rl;font-size:12px;opacity:.55;letter-spacing:.08em;display:none}
.drop{animation:fall 1.6s linear infinite}
@keyframes rip{0%{transform:scale(1);opacity:.9}100%{transform:scale(11,6);opacity:0}}.rip{transform-box:fill-box;transform-origin:center;animation:rip 2.7s ease-out infinite}.strm{animation:flow 1.1s linear infinite}@keyframes flow{50%{opacity:.8}}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(120px);opacity:0}}
@media(prefers-reduced-motion:reduce){.drop,.rip,.strm{animation:none}.go i{transition:none}}
/* sections */
section{padding-block:72px 0}
.kick{display:flex;align-items:center;gap:10px;color:var(--red);font-weight:600;font-size:15px;margin-bottom:10px}
.kick::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--red)}
.sec-h{font-size:clamp(26px,3.6vw,40px);margin-bottom:16px}
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center}
.about p{color:var(--muted);max-width:52ch}
.btn{display:inline-block;background:var(--red);color:var(--red-ink);text-decoration:none;font-weight:600;padding:11px 28px;border-radius:6px;border:0;font-family:inherit;font-size:15px;cursor:pointer;margin-top:12px}
.btn:hover{filter:brightness(1.1)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{border-radius:12px;background:var(--dark);aspect-ratio:3/4;overflow:hidden}
.tile.rd{background:var(--red);transform:translateY(32px)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px}
.cat .im{background:var(--dark);border-radius:14px;aspect-ratio:1/1.05;display:grid;place-items:center;overflow:hidden;margin-bottom:14px}
.cat .im img{transition:transform .35s}
.cat:hover .im img{transform:scale(1.07)}
.cat h3{color:var(--red);font-size:18px}
.cat p{color:var(--muted);font-size:14.5px;margin:4px 0 6px}
.cat a{color:var(--red);text-decoration:none;font-weight:600;font-size:14px}
/* cutaway */
.cut{background:#fff;border-radius:16px;position:relative;aspect-ratio:16/9;max-height:560px;width:100%}
:root:not([data-theme="light"]) .cutbg{}
.cut{background:#000;border:1px solid var(--line);overflow:hidden}
.ci{position:absolute;inset:0;margin:auto;height:100%;width:auto;max-width:100%;object-fit:contain}
.cl em{background:#fff;color:#18181b;border-color:#fff}.cl::before{background:#ffffffaa}
.cl{position:absolute;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.cl em{font-style:normal;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 14px}
.cl em{order:0}.cl::before{content:"";order:1;height:1px;width:clamp(30px,9vw,130px);background:var(--muted)}.cl::after{content:"";order:2;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #c4122f33}
.cl.r{flex-direction:row-reverse}
/* catalog */
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:var(--surface);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:5px 18px;border-radius:99px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .img{background:var(--dark);aspect-ratio:1/1;overflow:hidden}
.card .img img,.tile img,.cat .im img,.menu .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16.5px}
.card .meta{color:var(--muted);font-size:13.5px;line-height:1.6}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-variant-numeric:tabular-nums}
.price small{font-weight:300;color:var(--muted)}
.mini{display:flex;gap:6px}
.mini button{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.mini button[aria-pressed="true"]{border-color:var(--ink)}
.order{font-size:14px;padding:6px 14px;border-radius:6px;background:var(--red);color:#fff;text-decoration:none;white-space:nowrap}
/* service */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.svc div{border-top:2px solid var(--ink);padding-top:14px}
.svc b{display:block;font-size:34px;font-family:var(--f-disp);font-weight:400;color:var(--red);line-height:1.2}
.svc span{color:var(--muted);font-size:14.5px}
.cta{background:var(--dark);color:var(--dark-ink);padding:56px max(16px,env(safe-area-inset-right,0px));margin-top:72px}
.cta .wrap{display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h2{font-size:clamp(26px,3.6vw,38px)}.cta p{margin:6px 0 0;opacity:.75}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
footer{background:var(--dark);color:#8f8f97;font-size:14px;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid #ffffff14}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* menu */
.menu{position:fixed;inset:0;z-index:20;display:none;background:#0009}
.menu.open{display:flex}
.menu .pn{width:min(440px,100%);background:#fafafa;color:#18181b;margin-inline-start:0;padding:calc(24px + env(safe-area-inset-top,0px)) 32px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.menu .art{flex:1;background:var(--dark);display:grid;place-items:center}
.menu .pn a{font-size:22px;font-weight:600;text-decoration:none;padding:6px 0;color:#18181b}
.menu .pn a:hover{color:var(--red)}
.menu .pn a.sub{font-size:17px;font-weight:400;padding-inline-start:16px;color:#55555b}
.menu .x{align-self:flex-start;margin-bottom:12px;background:var(--red);color:#fff}
@media(max-width:760px){
  .hero{padding-block:100px 96px;min-height:0}.hero .in{grid-template-columns:1fr}.about{grid-template-columns:1fr}
  .brand span{display:none}.menu .art{display:none}.tile.rd{transform:none}
  .cut{aspect-ratio:auto;height:460px}.cl em{font-size:11px;padding:1px 9px}.cl::before{width:10px}.cl{gap:5px}.cl::after{width:10px;height:10px}.cut svg{max-width:70%}
}
</style>

<script>
const FIN={
  chrome:{n:{fa:'کروم',ar:'كروم'},a:'#f4f8fa',b:'#aebcc3',c:'#5d6e76'},
  black:{n:{fa:'مشکی مات',ar:'أسود مطفي'},a:'#8a9196',b:'#454b4f',c:'#1c1f21'},
  gold:{n:{fa:'طلایی',ar:'ذهبي'},a:'#ffe9a8',b:'#d9a93e',c:'#8a6217'},
  nickel:{n:{fa:'نیکل ساتن',ar:'نيكل ساتان'},a:'#e3ddd1',b:'#a89f8e',c:'#625b4c'}
};
const FK=Object.keys(FIN);
let uid=0;
function paint(f){const id='g'+(uid++);const F=FIN[f];
  return {id,defs:`<linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="${F.c}"/><stop offset=".35" stop-color="${F.a}"/><stop offset=".7" stop-color="${F.b}"/><stop offset="1" stop-color="${F.c}"/></linearGradient>`,fill:`url(#${id})`}}
/* each drawing: viewBox 200x200, water optional */
function faucet(type,f,water){
  const p=paint(f);const g=p.fill;let s='';
  const drops=(x,y,n=3)=>water?Array.from({length:n},(_,i)=>`<ellipse class="drop" style="animation-delay:${i*.5}s" cx="${x}" cy="${y}" rx="3" ry="5" fill="var(--water)"/>`).join(''):'';
  if(type==='basin'){
    s=`<rect x="70" y="150" width="60" height="16" rx="4" fill="${g}"/><rect x="82" y="80" width="36" height="72" rx="8" fill="${g}"/>
    <path d="M82 84 Q82 52 118 50 L150 50 Q158 50 158 58 L158 64 Q158 70 150 70 L120 70 L118 84Z" fill="${g}"/>
    <rect x="144" y="68" width="14" height="10" rx="3" fill="${g}"/><rect x="58" y="62" width="40" height="9" rx="4.5" fill="${g}" transform="rotate(-18 78 66)"/>${drops(151,86)}`;
  }else if(type==='kitchen'){
    s=`<rect x="56" y="156" width="68" height="14" rx="4" fill="${g}"/><rect x="76" y="86" width="28" height="72" rx="8" fill="${g}"/>
    <path d="M90 92 V50 Q90 22 120 22 Q150 22 150 50 V64" fill="none" stroke="${g}" stroke-width="20" stroke-linecap="round"/>
    <rect x="140" y="62" width="20" height="14" rx="4" fill="${g}"/><rect x="44" y="76" width="44" height="9" rx="4.5" fill="${g}" transform="rotate(-24 66 80)"/>${drops(150,92,3)}`;
  }else if(type==='rain'){
    s=`<rect x="30" y="20" width="22" height="160" rx="6" fill="${g}"/><rect x="48" y="30" width="80" height="14" rx="6" fill="${g}"/>
    <ellipse cx="140" cy="52" rx="48" ry="12" fill="${g}"/><ellipse cx="140" cy="49" rx="44" ry="8" fill="${g}" opacity=".7"/>
    ${water?[104,122,140,158,176].map((x,i)=>`<line class="drop" style="animation-delay:${i*.28}s" x1="${x}" y1="66" x2="${x-2}" y2="76" stroke="var(--water)" stroke-width="2.5" stroke-linecap="round"/>`).join(''):''}`;
  }else if(type==='wall'){
    s=`<rect x="20" y="40" width="160" height="14" rx="7" fill="${g}"/><circle cx="52" cy="47" r="22" fill="${g}"/><circle cx="148" cy="47" r="22" fill="${g}"/>
    <circle cx="52" cy="47" r="9" fill="${FIN[f].c}" opacity=".55"/><circle cx="148" cy="47" r="9" fill="${FIN[f].c}" opacity=".55"/>
    <path d="M100 54 V92 Q100 112 118 112 H132" fill="none" stroke="${g}" stroke-width="16" stroke-linecap="round"/>${drops(134,126,3)}`;
  }else{ /* hand */
    s=`<rect x="26" y="100" width="40" height="14" rx="7" fill="${g}"/><circle cx="34" cy="107" r="14" fill="${g}"/>
    <path d="M60 107 H100 Q124 107 124 128 V152" fill="none" stroke="${FIN[f].c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 7"/>
    <path d="M60 107 H100 Q124 107 124 128 V152" fill="none" stroke="${g}" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <rect x="116" y="24" width="16" height="70" rx="8" fill="${g}" transform="rotate(12 124 60)"/><ellipse cx="142" cy="24" rx="30" ry="9" fill="${g}" transform="rotate(12 142 24)"/>
    <rect x="30" y="70" width="8" height="30" rx="3" fill="${g}"/>`;
  }
  return `<svg class="f" viewBox="0 0 200 200" role="img" aria-hidden="true"><defs>${p.defs}</defs>${s}</svg>`;
}

function scene(f){
  const fx=faucet('basin',f,false).replace('<svg class="f" viewBox="0 0 200 200"','<svg x="60" y="0" width="280" height="280" viewBox="0 0 200 200"');
  return `<svg class="f" viewBox="40 0 460 380" role="img" aria-hidden="true">
  <defs><radialGradient id="glow" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#6cc9e6" stop-opacity=".28"/><stop offset="1" stop-color="#6cc9e6" stop-opacity="0"/></radialGradient>
  <linearGradient id="stream" x1="0" x2="1"><stop offset="0" stop-color="#6cc9e6" stop-opacity=".25"/><stop offset=".5" stop-color="#d6f3fb" stop-opacity=".95"/><stop offset="1" stop-color="#6cc9e6" stop-opacity=".25"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46464d"/><stop offset="1" stop-color="#1a1a1e"/></linearGradient></defs>
  <ellipse cx="270" cy="250" rx="190" ry="170" fill="url(#glow)"/>
  <path d="M60 318 Q60 372 270 372 Q480 372 480 318 Z" fill="url(#stone)" transform="translate(-60 0) scale(1)"/>
  <ellipse cx="270" cy="318" rx="210" ry="30" fill="#2c2c32"/>
  <ellipse cx="270" cy="318" rx="188" ry="23" fill="#0f2a33"/>
  ${fx}
  <rect x="265" y="108" width="9" height="206" rx="4" fill="url(#stream)" class="strm"/>
  <g fill="none" stroke="#bfeaf7" stroke-width="1.6">
   <ellipse class="rip" cx="270" cy="316" rx="10" ry="3"/><ellipse class="rip" style="animation-delay:.9s" cx="270" cy="316" rx="10" ry="3"/><ellipse class="rip" style="animation-delay:1.8s" cx="270" cy="316" rx="10" ry="3"/></g>
  </svg>`}
function cutaway(){
  const g='ctg';
  return `<svg viewBox="30 20 200 280" role="img" aria-hidden="true"><defs>
  <linearGradient id="${g}" x1="0" x2="1"><stop offset="0" stop-color="#7a5413"/><stop offset=".35" stop-color="#f1cf72"/><stop offset=".7" stop-color="#c8962f"/><stop offset="1" stop-color="#6e4a10"/></linearGradient>
  <linearGradient id="${g}b" x1="0" x2="1"><stop offset="0" stop-color="#1c2a4a"/><stop offset=".4" stop-color="#3b5488"/><stop offset="1" stop-color="#14203a"/></linearGradient></defs>
